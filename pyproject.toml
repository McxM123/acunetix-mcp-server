[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acunetix-mcp"
version = "1.2.0"
description = "MCP (Model Context Protocol) server for Acunetix / Invicti Web Vulnerability Scanner — lets any LLM operate targets, scans, vulnerabilities, reports and users via a unified GraphQL + REST API bridge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "McxM123" }]
keywords = ["mcp", "acunetix", "invicti", "wvs", "llm", "ai", "security", "scanner"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.10.0,<2.0",
    "requests>=2.31",
    "urllib3>=2.0",
]

[project.scripts]
acunetix-mcp = "acunetix_mcp:main"

[tool.setuptools]
packages = ["acunetix_mcp"]

[tool.setuptools.package-data]
acunetix_mcp = ["py.typed"]
